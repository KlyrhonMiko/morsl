name: morsl
description: Little bites. Our little history. A local-first meal scrapbook.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.12.0
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  drift: ^2.32.0
  sqlite3: ^3.1.5
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.3
  image_picker: ^1.2.1
  image: ^4.8.0
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  supabase_flutter: ^2.12.0
  google_sign_in: 7.2.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.0.1
  share_plus: ^12.0.1
  intl: ^0.20.2
  crypto: ^3.0.7
  connectivity_plus: ^7.0.0
  http: ^1.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand.ttf
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat.ttf
